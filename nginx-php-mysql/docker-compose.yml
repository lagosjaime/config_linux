services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - /home/lagosjaime/Desarrollo/web:/var/www/html:z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - php

  php:
    image: php:8.4-fpm
    volumes:
      - /home/lagosjaime/Desarrollo/web:/var/www/html:z

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: desarrollo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql

volumes:
  mysql_data:
